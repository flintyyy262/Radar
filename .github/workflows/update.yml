name: Обновление данных

on:
  schedule:
    - cron: "17 * * * *"   # каждый час в :17
  workflow_dispatch:         # кнопка ручного запуска во вкладке Actions

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Загрузить матчи из PandaScore
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
        run: node scripts/update.mjs

      - name: Сохранить изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          if git diff --cached --quiet; then
            echo "Данные не изменились"
          else
            git commit -m "Обновление данных"
            git push
          fi
